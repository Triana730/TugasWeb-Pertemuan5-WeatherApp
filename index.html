<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Tugas 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-app">
        <h1>🌤️ Weather App</h1>
        
        <!-- Search Form -->
        <form id="searchForm">
            <input type="text" id="cityInput" placeholder="Masukkan nama kota..." autocomplete="off">
            <button type="submit">Cari</button>
        </form>

        <!-- Loading State -->
        <div id="loading" class="hidden">Memuat data...</div>

        <!-- Error Message -->
        <div id="error" class="hidden"></div>

        <!-- Weather Result -->
        <div id="weatherResult" class="hidden">
            <h2 id="cityName"></h2>
            <img id="weatherIcon" alt="weather icon">
            <p id="temperature" class="temp"></p>
            <p id="description"></p>
            <p id="humidity"></p>
        </div>

        <!-- Riwayat Pencarian (Implementasi Array Method & LocalStorage) -->
        <div id="historySection" class="history-section hidden">
            <h3>Riwayat Pencarian</h3>
            <ul id="historyList"></ul>
            <button id="clearHistory" class="clear-btn">Hapus Riwayat</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
